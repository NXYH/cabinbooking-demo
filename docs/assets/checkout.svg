<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="Simulated Razorpay checkout: processing then payment successful">
  <style>
    .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .spin { animation: spin 1s linear infinite, phaseA 6s infinite; transform-origin: 455px 165px; }
    .shield { animation: phaseA 6s infinite; }
    .procText { animation: phaseA 6s infinite; }
    .ok { opacity: 0; animation: phaseB 6s infinite; }
    .okCircle { transform-origin: 455px 165px; animation: pop 6s infinite; }
    .tick { stroke-dasharray: 60; stroke-dashoffset: 60; animation: tick 6s infinite; }
    .ring { transform-origin: 455px 165px; animation: ring 6s infinite; opacity: 0; }
    .bar { animation: bar 6s infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }
    @keyframes phaseA { 0%, 45% { opacity: 1 } 50%, 100% { opacity: 0 } }
    @keyframes phaseB { 0%, 48% { opacity: 0 } 52%, 95% { opacity: 1 } 100% { opacity: 0 } }
    @keyframes pop { 0%, 48% { transform: scale(0) } 56% { transform: scale(1.1) } 60%, 100% { transform: scale(1) } }
    @keyframes tick { 0%, 56% { stroke-dashoffset: 60 } 66%, 100% { stroke-dashoffset: 0 } }
    @keyframes ring { 0%, 55% { opacity: 0; transform: scale(.7) } 60% { opacity: .8; transform: scale(.8) } 80%, 100% { opacity: 0; transform: scale(1.6) } }
    @keyframes bar { 0% { width: 10px } 45% { width: 180px } 100% { width: 180px } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } .ok { opacity: 1 } .tick { stroke-dashoffset: 0 } .spin, .shield, .procText { opacity: 0 } }
  </style>
  <defs><linearGradient id="navy" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#072654"/><stop offset="1" stop-color="#0D3C84"/></linearGradient></defs>
  <rect width="640" height="360" fill="#EEF1F5"/>
  <g class="sans">
    <rect x="20" y="20" width="600" height="320" rx="12" fill="#ffffff"/>
    <path d="M32 20 h208 v320 h-208 a12 12 0 0 1 -12 -12 v-296 a12 12 0 0 1 12 -12z" fill="url(#navy)"/>
    <rect x="44" y="48" width="40" height="40" rx="8" fill="#ffffff"/><text x="64" y="74" text-anchor="middle" font-size="15" font-weight="700" fill="#072654">TC</text>
    <text x="96" y="64" font-size="15" font-weight="600" fill="#ffffff">The Cabin</text>
    <text x="96" y="82" font-size="11" fill="#ffffff" fill-opacity=".7">Trusted business</text>
    <text x="44" y="130" font-size="11" fill="#ffffff" fill-opacity=".6">Price summary</text>
    <text x="44" y="162" font-size="30" font-weight="600" fill="#ffffff">₹8,850</text>
    <text x="44" y="186" font-size="12" fill="#ffffff" fill-opacity=".7">Tue 13 Oct, 17:00 to 20:00</text>
    <text x="44" y="316" font-size="11" fill="#ffffff" fill-opacity=".6">Secured by Razorpay (test mode)</text>
    <line x1="240" y1="68" x2="620" y2="68" stroke="#E5E9EF"/>
    <text x="262" y="50" font-size="14" font-weight="600" fill="#162B4D">Payment</text>
    <rect x="540" y="36" width="64" height="20" rx="4" fill="#FEF3C7"/><text x="572" y="50" text-anchor="middle" font-size="10" font-weight="700" fill="#B45309">TEST MODE</text>

    <!-- processing -->
    <circle cx="455" cy="165" r="36" fill="none" stroke="#E3EEFF" stroke-width="6" class="procText"/>
    <circle class="spin" cx="455" cy="165" r="36" fill="none" stroke="#3395FF" stroke-width="6" stroke-linecap="round" stroke-dasharray="60 170"/>
    <path class="shield" d="M455 148 l14 6 v10 c0 9 -6 15 -14 18 c-8 -3 -14 -9 -14 -18 v-10z" fill="none" stroke="#072654" stroke-width="2.5"/>
    <g class="procText">
      <text x="455" y="236" text-anchor="middle" font-size="14" font-weight="600" fill="#162B4D">Authorising with your bank…</text>
      <rect x="365" y="252" width="180" height="4" rx="2" fill="#E2E8F0"/>
      <rect class="bar" x="365" y="252" width="10" height="4" rx="2" fill="#3395FF"/>
    </g>

    <!-- success -->
    <g class="ok">
      <circle class="ring" cx="455" cy="165" r="40" fill="none" stroke="#34D399" stroke-width="2"/>
      <g class="okCircle"><circle cx="455" cy="165" r="34" fill="#10B981"/></g>
      <path class="tick" d="M440 166 l10 10 l20 -22" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="455" y="236" text-anchor="middle" font-size="15" font-weight="600" fill="#162B4D">Payment successful</text>
      <text x="455" y="258" text-anchor="middle" font-size="12" fill="#64748B">pay_4ehKt7mwuHdDZg</text>
    </g>
  </g>
</svg>
