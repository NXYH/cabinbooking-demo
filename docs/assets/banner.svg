<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="The Cabin, conference hall booking demo">
  <style>
    .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .slot { fill: #ffffff; fill-opacity: .07; stroke: #ffffff; stroke-opacity: .18; }
    .pick { fill: #ffffff; opacity: 0; animation: pick 6s ease-in-out infinite; }
    .booked { fill: #ffffff; fill-opacity: .16; }
    .card { animation: card 6s ease-in-out infinite; transform-box: fill-box; }
    .check { stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw 6s ease-out infinite; }
    .pulse { animation: pulse 2s ease-in-out infinite; transform-origin: 1062px 112px; }
    @keyframes pick { 0%, 15% { opacity: 0 } 22%, 80% { opacity: 1 } 92%, 100% { opacity: 0 } }
    @keyframes card { 0%, 45% { opacity: 0; transform: translateY(14px) } 55%, 85% { opacity: 1; transform: translateY(0) } 95%, 100% { opacity: 0; transform: translateY(0) } }
    @keyframes draw { 0%, 55% { stroke-dashoffset: 30 } 65%, 100% { stroke-dashoffset: 0 } }
    @keyframes pulse { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .pick, .card { animation: none; opacity: 1 } .check { animation: none; stroke-dashoffset: 0 } }
  </style>
  <rect width="1280" height="420" fill="#0E4A43"/>
  <rect x="0" y="0" width="1280" height="420" fill="url(#g)"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E4A43"/><stop offset="1" stop-color="#0A3631"/>
    </linearGradient>
  </defs>

  <g class="sans" fill="#ffffff">
    <text x="72" y="118" font-size="20" fill-opacity=".7">Conference hall booking demo</text>
    <text x="72" y="196" font-size="68" font-weight="600" letter-spacing="-2">The Cabin</text>
    <text x="72" y="248" font-size="22" fill-opacity=".8">Book a hall by the hour, pay online, get confirmed.</text>
    <text x="72" y="282" font-size="22" fill-opacity=".8">With a full admin console behind it.</text>
    <g font-size="15" fill-opacity=".85">
      <rect x="72" y="320" width="98" height="34" rx="6" fill="#ffffff" fill-opacity=".1"/><text x="88" y="342">Next.js 16</text>
      <rect x="180" y="320" width="98" height="34" rx="6" fill="#ffffff" fill-opacity=".1"/><text x="196" y="342">shadcn/ui</text>
      <rect x="288" y="320" width="90" height="34" rx="6" fill="#ffffff" fill-opacity=".1"/><text x="304" y="342">Zustand</text>
      <rect x="388" y="320" width="96" height="34" rx="6" fill="#ffffff" fill-opacity=".1"/><text x="404" y="342">Recharts</text>
      <rect x="494" y="320" width="122" height="34" rx="6" fill="#ffffff" fill-opacity=".1"/><text x="510" y="342">Framer Motion</text>
    </g>
  </g>

  <!-- Slot board -->
  <g class="sans" transform="translate(720 70)">
    <rect width="488" height="280" rx="10" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".15"/>
    <text x="24" y="40" font-size="16" fill="#ffffff" fill-opacity=".85">Tue 13 Oct</text>
    <circle class="pulse" cx="342" cy="42" r="4" fill="#7FD1C1"/>
    <text x="354" y="47" font-size="14" fill="#ffffff" fill-opacity=".7">Live availability</text>
    <g font-size="13" fill="#ffffff" fill-opacity=".85">
      <!-- row 1 -->
      <rect class="slot" x="24" y="64" width="102" height="40" rx="6"/><text x="56" y="89">08:00</text>
      <rect class="slot" x="138" y="64" width="102" height="40" rx="6"/><text x="170" y="89">09:00</text>
      <rect class="booked" x="252" y="64" width="102" height="40" rx="6"/><text x="284" y="89" fill-opacity=".45">10:00</text>
      <rect class="booked" x="366" y="64" width="98" height="40" rx="6"/><text x="396" y="89" fill-opacity=".45">11:00</text>
      <!-- row 2 -->
      <rect class="slot" x="24" y="116" width="102" height="40" rx="6"/><text x="56" y="141">12:00</text>
      <rect class="slot" x="138" y="116" width="102" height="40" rx="6"/><text x="170" y="141">13:00</text>
      <rect class="slot" x="252" y="116" width="102" height="40" rx="6"/><text x="284" y="141">14:00</text>
      <rect class="slot" x="366" y="116" width="98" height="40" rx="6"/><text x="396" y="141">15:00</text>
    </g>
    <!-- picked slots animate in one by one -->
    <g font-size="13" class="sans">
      <rect class="pick" style="animation-delay:0s" x="138" y="116" width="102" height="40" rx="6"/>
      <rect class="pick" style="animation-delay:.25s" x="252" y="116" width="102" height="40" rx="6"/>
      <rect class="pick" style="animation-delay:.5s" x="366" y="116" width="98" height="40" rx="6"/>
      <text class="pick" style="animation-delay:0s;fill:#0E4A43" x="170" y="141">13:00</text>
      <text class="pick" style="animation-delay:.25s;fill:#0E4A43" x="284" y="141">14:00</text>
      <text class="pick" style="animation-delay:.5s;fill:#0E4A43" x="396" y="141">15:00</text>
    </g>
    <!-- confirmation card -->
    <g class="card">
      <rect x="24" y="176" width="440" height="80" rx="8" fill="#ffffff"/>
      <circle cx="62" cy="216" r="18" fill="#0E4A43"/>
      <path class="check" d="M53 216 l6 6 l12 -13" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="94" y="208" font-size="16" font-weight="600" fill="#1B2321">Booking confirmed</text>
      <text x="94" y="232" font-size="14" fill="#5D6866">13:00 to 16:00, 45 guests, ₹8,850 paid by UPI</text>
    </g>
  </g>
</svg>
